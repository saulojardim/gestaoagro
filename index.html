<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rebanho">
<meta name="theme-color" content="#1F5130">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Gestão do Rebanho</title>
<style>
  :root{
    --verde:#2E8B4F;         /* verde de acento (ícones, títulos de seção) */
    --verde-esc:#1F5130;     /* verde escuro (hero, texto forte) */
    --verde-med:#3AA05C;
    --verde-lite:#E8F3EA;    /* fundo claro dos módulos/ícones */
    --verde-lite2:#DCEEDF;
    --fundo:#F6F8F6;
    --card:#FFFFFF;
    --texto:#1A1D1A;
    --muted:#7C837C;
    --linha:#E6EAE6;
    --perigo:#B4432E;
    --sombra:0 1px 3px rgba(20,40,25,.06),0 1px 2px rgba(20,40,25,.04);
    --radius:16px;
    --nav-h:66px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--fundo);color:var(--texto);font-size:16px;line-height:1.4;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Topo ---------- */
  .topo{
    background:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--linha);
  }
  .topo .icobtn{width:40px;height:40px;border-radius:12px;background:none;color:var(--verde-esc);font-size:22px;
    display:flex;align-items:center;justify-content:center;}
  .topo .tit{flex:1;text-align:center;}
  .topo .tit h1{margin:0;font-size:19px;font-weight:800;color:var(--verde-esc);}
  .topo .tit .sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .topo .mais{width:44px;height:44px;border-radius:50%;background:var(--verde);color:#fff;font-size:26px;
    box-shadow:var(--sombra);display:flex;align-items:center;justify-content:center;}
  .topo .mais:active{background:var(--verde-med);}

  main{max-width:660px;margin:0 auto;padding:16px 14px 8px;}

  /* ---------- Hero ---------- */
  .hero{
    background:linear-gradient(135deg,#245e38 0%,#1c4a2c 55%,#173f26 100%);
    border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sombra);
    margin-bottom:22px;
  }
  .hero .cattle{position:absolute;right:-10px;bottom:-14px;opacity:.16;width:180px;height:auto;}
  .hero .cabeca{display:flex;align-items:center;gap:12px;}
  .hero .tile{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;}
  .hero .rot{font-size:15px;font-weight:600;opacity:.95;}
  .hero .num{font-size:52px;font-weight:800;line-height:1;margin:6px 0 2px;}
  .hero .peq{font-size:14px;opacity:.85;}
  .hero .linha{display:flex;align-items:center;gap:14px;margin-top:14px;border-top:1px solid rgba(255,255,255,.18);padding-top:12px;}
  .hero .frase{font-size:12.5px;opacity:.9;line-height:1.5;}
  .hero .assinatura{position:absolute;right:18px;top:16px;font-style:italic;font-size:13px;opacity:.85;text-align:right;max-width:120px;}

  /* ---------- Seções ---------- */
  .sechead{display:flex;align-items:center;gap:8px;margin:0 4px 12px;}
  .sechead .sic{color:var(--verde);font-size:20px;}
  .sechead h2{margin:0;font-size:19px;font-weight:800;color:var(--verde-esc);flex:1;}
  .sechead a{color:var(--verde);font-size:14px;font-weight:600;text-decoration:none;}

  /* ---------- Cartão de propriedade ---------- */
  .prop{background:#fff;border-radius:var(--radius);box-shadow:var(--sombra);padding:12px;margin-bottom:12px;cursor:pointer;}
  .prop:active{background:#fafbfa;}
  .prop .top{display:flex;gap:12px;align-items:center;}
  .prop .thumb{width:80px;height:64px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(160deg,#cfe6d4,#a9d3b3);display:flex;align-items:center;justify-content:center;color:#2c6b41;}
  .prop .nome{font-size:18px;font-weight:700;color:var(--verde-esc);}
  .prop .loc{font-size:13px;color:var(--muted);margin-top:2px;}
  .prop .chev{color:var(--muted);font-size:20px;}
  .prop .stats{display:flex;align-items:stretch;gap:12px;background:#f4f8f4;border-radius:12px;padding:10px 12px;margin-top:10px;}
  .prop .stats .tot{padding-right:12px;border-right:1px solid var(--linha);}
  .prop .stats .lbl{font-size:11px;color:var(--muted);}
  .prop .stats .big{font-size:24px;font-weight:800;color:var(--verde-esc);}
  .prop .marcas{display:flex;gap:16px;flex:1;}
  .prop .marcas .m{text-align:center;}
  .prop .marcas .ms{font-size:11px;color:var(--muted);font-weight:700;}
  .prop .marcas .mn{font-size:18px;font-weight:800;color:var(--verde-esc);}

  /* ---------- Módulos ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mod{background:var(--verde-lite);border-radius:var(--radius);padding:14px;cursor:pointer;position:relative;}
  .mod:active{background:var(--verde-lite2);}
  .mod .mic{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    color:var(--verde);font-size:22px;margin-bottom:10px;box-shadow:var(--sombra);}
  .mod .mt{font-weight:700;color:var(--verde-esc);font-size:15px;}
  .mod .md{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35;}
  .mod .chev{position:absolute;right:12px;top:14px;color:var(--verde);opacity:.6;}

  .faixa{background:#eef4ef;border-radius:var(--radius);padding:14px 16px;margin-top:18px;display:flex;align-items:center;gap:12px;}
  .faixa .fic{color:var(--verde);font-size:22px;}
  .faixa .ft{font-size:13.5px;color:#3a4a3d;line-height:1.4;}

  /* ---------- Listas genéricas ---------- */
  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--sombra);padding:14px;margin-bottom:10px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .rt{cursor:pointer;} .rt:active{background:#fafbfa;}
  .ti{font-weight:600;font-size:16px;} .meta{color:var(--muted);font-size:13px;margin-top:2px;}
  .badge{background:var(--verde);color:#fff;font-size:13px;font-weight:600;border-radius:20px;padding:3px 11px;white-space:nowrap;}
  .chip{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;margin-right:4px;line-height:1;vertical-align:middle;}
  .chip-lote{background:var(--verde-lite);color:var(--verde-esc);}
  .chip-f{background:#fbe9ef;color:#a13a63;} .chip-m{background:#e6eef6;color:#2f6fa8;}
  .chip-off{background:#eee;color:#777;} .chip-marca{background:#fff4d6;color:#8a6a12;}
  .chip-id{background:#eef2ef;color:#5a6b5e;}
  .avatar{width:64px;height:64px;border-radius:50%;background:var(--verde-lite);color:var(--verde);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .avatar-wrap{position:relative;width:64px;height:64px;flex-shrink:0;cursor:pointer;}
  .avatar-cam{position:absolute;right:-3px;bottom:-3px;width:25px;height:25px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid #fff;}
  .voltar{background:none;color:var(--verde-esc);font-weight:600;font-size:15px;padding:0;margin:2px 0 12px;}
  .h3{margin:18px 4px 10px;font-size:15px;color:var(--muted);font-weight:700;}
  .evt{border-left:3px solid var(--verde);padding:2px 0 12px 12px;margin-left:4px;}
  .evt:last-child{padding-bottom:0;}
  .evt .tp{font-weight:600;font-size:15px;} .evt .dt{color:var(--muted);font-size:12px;} .evt .de{font-size:14px;margin-top:2px;}
  .vazio{text-align:center;color:var(--muted);padding:36px 20px;} .vazio .big{font-size:34px;margin-bottom:8px;}

  /* ---------- Botões ---------- */
  button{font-family:inherit;font-size:16px;cursor:pointer;border:none;}
  .btn{display:block;width:100%;background:var(--verde);color:#fff;padding:14px;border-radius:14px;font-weight:600;margin-bottom:10px;box-shadow:var(--sombra);}
  .btn:active{background:var(--verde-med);}
  .btn-sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde);box-shadow:none;}
  .btn-perigo{background:#fff;color:var(--perigo);border:1.5px solid var(--perigo);box-shadow:none;}
  .btn-fant{background:none;color:var(--muted);padding:10px;box-shadow:none;}
  .lado{display:flex;gap:8px;} .lado .btn{margin-bottom:0;}

  /* ---------- Modal ---------- */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .ov.on{display:flex;}
  .modal{background:#fff;width:100%;max-width:660px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:sobe .18s ease;}
  @keyframes sobe{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .modal h2{margin:0 0 12px;font-size:18px;color:var(--verde-esc);}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:600;}
  input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--linha);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;color:var(--texto);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde);}
  textarea{resize:vertical;min-height:60px;}
  .sheet-item{padding:15px 4px;border-bottom:1px solid var(--linha);font-size:16px;display:flex;gap:12px;align-items:center;}
  .sheet-item:last-child{border-bottom:none;} .sheet-item .si{color:var(--verde);font-size:20px;width:24px;text-align:center;}

  /* ---------- Nav ---------- */
  nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:#fff;border-top:1px solid var(--linha);display:flex;z-index:30;}
  nav button{flex:1;background:none;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
  nav button .ic{font-size:21px;line-height:1;} nav button.ativo{color:var(--verde);}
  .tile img{width:46px;height:46px;object-fit:contain;display:block;}
  .mic img{width:38px;height:38px;object-fit:contain;display:block;}
  nav .ic img{width:28px;height:24px;object-fit:contain;display:inline-block;vertical-align:middle;}
</style>
</head>
<body>

<div class="topo">
  <button class="icobtn" onclick="menuConfig()">☰</button>
  <div class="tit"><h1>Gestão do Rebanho</h1><div class="sub">Pecuária organizada gera resultados</div></div>
  <button class="mais" onclick="menuAdicionar()">+</button>
</div>

<main id="tela"></main>

<nav>
  <button data-aba="painel" class="ativo"><span class="ic">⌂</span>Painel</button>
  <button data-aba="lotes"><span class="ic">▤</span>Lotes</button>
  <button data-aba="animais"><span class="ic"><img src="boi.png" alt=""></span>Animais</button>
  <button data-aba="perfil"><span class="ic">◔</span>Perfil</button>
</nav>

<div class="ov" id="ov"><div class="modal" id="md"></div></div>

<script>
/* ======================= BANCO (IndexedDB, offline) ======================= */
const DB="rebanho_v2"; let db;
function abrirDB(){return new Promise((ok,er)=>{const r=indexedDB.open(DB,3);
  r.onupgradeneeded=e=>{const d=e.target.result;
    const criar=n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:"id"});};
    criar("propriedades"); criar("marcas"); criar("lotes");
    criar("animais"); criar("eventos"); criar("medicamentos"); criar("perfil");
  };
  r.onsuccess=e=>{db=e.target.result;ok();}; r.onerror=er;});}
function tx(s,m="readonly"){return db.transaction(s,m).objectStore(s);}
function getAll(s){return new Promise(ok=>{const r=tx(s).getAll();r.onsuccess=()=>ok(r.result);});}
function get(s,id){return new Promise(ok=>{const r=tx(s).get(id);r.onsuccess=()=>ok(r.result);});}
function put(s,o){return new Promise(ok=>{const r=tx(s,"readwrite").put(o);r.onsuccess=()=>ok(o);});}
function del(s,id){return new Promise(ok=>{const r=tx(s,"readwrite").delete(id);r.onsuccess=()=>ok();});}
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
const codAnimal=a=>"#"+String((a&&a.codigo)||0).padStart(3,'0');
const rotulo=a=>(a&&(a.brinco||a.nome))||codAnimal(a);
async function proximoCodigo(){const as=await getAll("animais");return as.reduce((m,a)=>Math.max(m,a.codigo||0),0)+1;}
const numBR=id=>{let v=val(id);if(!v)return null;if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');const n=parseFloat(v);return isNaN(n)?null:n;};
const moeda=n=>n==null?"—":n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hoje=()=>new Date().toISOString().slice(0,10);
const horaAgora=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0');};
const fmt=d=>{if(!d)return"";const[a,m,x]=d.split("-");return`${x}/${m}/${a}`;};
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val=id=>(document.getElementById(id).value||"").trim();
const TIPOS=["Vacinação","Medicamento","Marcação","Nascimento","Movimentação","Pesagem","Tratamento","Reprodução","Morte","Venda","Outro"];
const VIAS=["Injeção","Pour on","Spray","Brinco","Ingestão","Outro"];
const TIPOS_MED=["Vacina","Antibiótico","Vermífugo","Anti-inflamatório","Carrapaticida/Mosquicida","Vitamina/Mineral","Hormônio","Outro"];
const optTipoMed=sel=>TIPOS_MED.map(t=>`<option value="${t}" ${t===sel?"selected":""}>${t}</option>`).join("");
const svgMacho=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2f7bef" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="14.5" r="6"/><line x1="13.8" y1="10.2" x2="20" y2="4"/><polyline points="14.5 4 20 4 20 9.5"/></svg>`;
const svgFemea=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e24fa0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><line x1="12" y1="15" x2="12" y2="22"/><line x1="8.5" y1="18.5" x2="15.5" y2="18.5"/></svg>`;
const sexoChip=s=>s==="F"?`<span class="chip chip-f">${svgFemea}</span>`:`<span class="chip chip-m">${svgMacho}</span>`;
const COW=`<svg class="cattle" viewBox="0 0 640 512" xmlns="http://www.w3.org/2000/svg"><path fill="#fff" d="M96 224c0-53 43-96 96-96h256c53 0 96 43 96 96v32c0 71-57 128-128 128H224c-71 0-128-57-128-128v-32zm40-140c-8-20-30-52-70-52-6 0-10 6-8 12 8 26 30 52 60 60 9 3 21-11 18-20zm368 0c-3 9 9 23 18 20 30-8 52-34 60-60 2-6-2-12-8-12-40 0-62 32-70 52zM240 300a20 20 0 100-40 20 20 0 000 40zm160 0a20 20 0 100-40 20 20 0 000 40z"/></svg>`;

/* Carrega tudo de uma vez e monta em memória */
async function tudo(){
  const [propriedades,marcas,lotes,animais,eventos,medicamentos]=await Promise.all(
    ["propriedades","marcas","lotes","animais","eventos","medicamentos"].map(getAll));
  return {propriedades,marcas,lotes,animais,eventos,medicamentos};
}
const propDoAnimal=(a,lotes)=>{const l=lotes.find(x=>x.id===a.loteAtualId);return l?l.propriedadeId:null;};

/* ======================= AÇÕES ======================= */
async function registrarEvento(animalId,tipo,data,detalhes,extra){
  const a=await get("animais",animalId);
  const ev=Object.assign({id:uid(),animalId,tipo,data:data||hoje(),detalhes:detalhes||"",criadoEm:Date.now()}, extra||{});
  await put("eventos",ev);
  if(a&&(tipo==="Morte"||tipo==="Venda")){a.status=tipo==="Morte"?"Morto":"Vendido";await put("animais",a);}
}
async function moverAnimal(id,novoLote){
  const a=await get("animais",id),de=await get("lotes",a.loteAtualId),para=await get("lotes",novoLote);
  a.loteAtualId=novoLote;await put("animais",a);
  await registrarEvento(id,"Movimentação",hoje(),`De "${de?de.nome:"—"}" para "${para?para.nome:"—"}"`);
}
async function vacinarLote(loteId,vac,data,hora){
  const as=(await getAll("animais")).filter(a=>a.loteAtualId===loteId&&a.status==="Ativo");
  for(const a of as)await registrarEvento(a.id,"Vacinação",data,vac,{hora});
  return as.length;
}

/* ======================= NAV ======================= */
const $t=document.getElementById("tela"); let aba="painel"; let _perfilFoto="";
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  aba=b.dataset.aba;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("ativo",x===b));
  render();
});
function irAba(a){aba=a;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("ativo",x.dataset.aba===a));render();}
function render(){({painel:telaPainel,lotes:telaLotes,animais:telaAnimais,perfil:telaPerfil}[aba])();}
function voltar(){render();}

/* ======================= PAINEL (dashboard) ======================= */
async function telaPainel(){
  const {propriedades,marcas,lotes,animais}=await tudo();
  const ativos=animais.filter(a=>a.status==="Ativo");
  const total=ativos.length;

  const contaProp=pid=>ativos.filter(a=>propDoAnimal(a,lotes)===pid);
  const contaMarca=(arr,mid)=>arr.filter(a=>a.marcaId===mid).length;

  let props="";
  if(propriedades.length===0){
    props=`<div class="card vazio"><div class="big">🏡</div><b>Nenhuma propriedade</b>
      <div class="meta">Toque no + e cadastre sua primeira propriedade.</div></div>`;
  }else{
    for(const p of propriedades){
      const arr=contaProp(p.id);
      let cols=marcas.map(m=>`<div class="m"><div class="ms">${esc(m.sigla)}</div><div class="mn">${contaMarca(arr,m.id)}</div></div>`).join("");
      props+=`<div class="prop" onclick="verPropriedade('${p.id}')">
        <div class="top">
          <div class="thumb">🌳</div>
          <div style="flex:1"><div class="nome">${esc(p.nome)}</div>
            <div class="loc">📍 ${esc(p.local||"")}</div></div>
          <div class="chev">›</div>
        </div>
        <div class="stats">
          <div class="tot"><div class="lbl">Total de animais</div><div class="big">${arr.length}</div></div>
          ${marcas.length?`<div class="marcas">${cols}</div>`:""}
        </div></div>`;
    }
  }

  $t.innerHTML=`
    <div class="hero">
      <div class="assinatura">Pecuária que evolui com você</div>
      <div class="cabeca"><div class="tile"><img src="boi.png" alt="boi"></div><div class="rot">Total do Rebanho</div></div>
      <div class="num">${total}</div><div class="peq">animais cadastrados</div>
      <div class="linha"><span style="font-size:20px">📊</span>
        <div class="frase">Mais controle<br>Mais produtividade<br>Um futuro maior</div></div>
    </div>

    <div class="sechead"><span class="sic">🏠</span><h2>Propriedades cadastradas</h2>
      <a onclick="irAba('lotes')">Ver todas ›</a></div>
    ${props}

    <div class="sechead" style="margin-top:22px"><span class="sic">▦</span><h2>Módulos do sistema</h2></div>
    <div class="grid">
      ${mod("▤","Lotes","Incluir ou mover gado entre lotes.","irAba('lotes')")}
      ${mod('<img src="bezerro.png" alt="">',"Nascimento de Bezerro","Registro de bezerros com vínculo da mãe.","formNovoAnimal(null,true)")}
      ${mod("☑","Eventos de Manejo","Marcar, medicar ou trocar de lote.","telaManejo()")}
      ${mod("🗂","Histórico por Animal","Veja tudo que foi feito no animal, com datas.","irAba('animais')")}
    </div>

    <div class="faixa"><span class="fic">📈</span>
      <div class="ft"><b>Informação no campo,</b> decisões mais assertivas.</div></div>`;
}
const mod=(ic,t,d,fn)=>`<div class="mod" onclick="${fn}"><div class="mic">${ic}</div>
  <div class="mt">${t}</div><div class="md">${d}</div><div class="chev">›</div></div>`;

async function verPropriedade(pid){
  const p=await get("propriedades",pid);
  const {lotes,animais}=await tudo();

async function telaLotes(){

  else{
    for(const p of propriedades){
      const ls=lotes.filter(l=>l.propriedadeId===p.id);if(!ls.length)continue;
      html+=`<div class="h3">${esc(p.nome)}</div>`;

        <div><div class="ti">${esc(l.nome)}</div>${l.descricao?`<div class="meta">${esc(l.descricao)}</div>`:""}</div>

        <div class="ti">${esc(l.nome)}</div><span class="badge">${conta(l.id)} 🐄</span></div>`;}

async function verLote(id){

  const nomeLote=l.nome;
  let lst=animais.length?"":`<div class="meta" style="padding:8px 4px">Nenhum animal ativo neste lote.</div>`;
  for(const a of animais.sort((x,y)=>x.brinco.localeCompare(y.brinco)))lst+=linhaAnimal(a,nomeLote,false);

async function verAnimal(id){

    .sort((x,y)=>y.data.localeCompare(x.data)||y.criadoEm-x.criadoEm);

  for(const e of eventos){

    tl+=`<div class="evt"><div class="tp">${esc(e.tipo)}</div><div class="dt">${quando}</div>${med?`<div class="de">${med}</div>`:""}${e.detalhes?`<div class="de">${esc(e.detalhes)}</div>`:""}</div>`;
  }
  $t.innerHTML=`<button class="voltar" onclick="voltar()">‹ Voltar</button>
    <div class="card"><div class="ti" style="font-size:20px">${esc(rotulo(a))}${a.brinco&&a.nome?` · ${esc(a.nome)}`:""} <span class="chip chip-id">${codAnimal(a)}</span></div>
      <div class="meta" style="margin-top:6px">
        ${sexoChip(a.sexo)}
        <span class="chip chip-lote">▦ ${esc(nomeLote)}</span>
        ${marca?`<span class="chip chip-marca">${esc(marca.sigla)}</span>`:""}
        ${a.status!=="Ativo"?`<span class="chip chip-off">${a.status}</span>`:""}</div>
      <div class="meta" style="margin-top:8px">
        ${a.nascidoNaPropriedade?`Origem: nascido na propriedade<br>`:(a.nascidoNaPropriedade===false?`Origem: comprado${a.pesoCompraKg?` — ${a.pesoCompraKg} kg vivo`:""}<br>`:"")}
        ${a.dataNascimento?`Nascimento: ${fmt(a.dataNascimento)}<br>`:""}
        ${mae?`Mãe: <b onclick="verAnimal('${mae.id}')" style="color:var(--verde);cursor:pointer">${esc(rotulo(mae))}</b><br>`:""}
        ${filhos.length?`Filhos: ${filhos.length}`:""}</div>
      ${a.saida?blocoSaida(a.saida):""}</div>
    <button class="btn btn-sec" onclick="formEditarAnimal('${id}')">✎ Editar dados</button>
    <div class="lado"><button class="btn" onclick="formEvento('${id}','Vacinação')">💉 Vacinar</button>
      <button class="btn btn-sec" onclick="formMover('${id}')">↷ Mover lote</button></div>
    <button class="btn btn-sec" onclick="formEvento('${id}')">+ Registrar evento de manejo</button>
    ${a.status==="Ativo"?`<button class="btn btn-perigo" onclick="formSaida('${id}')">↩ Registrar saída (morte/venda)</button>`:""}

}

const iniciais=nome=>((nome||"").trim().split(/\s+/).slice(0,2).map(s=>s[0]||"").join("").toUpperCase()||"?");
const avatarHTML=(foto,nome)=>foto?`<img src="${foto}" alt="">`:`<span>${esc(iniciais(nome))}</span>`;
function lerFotoRedimensionada(file,cb){
  const rd=new FileReader();
  rd.onload=e=>{const img=new Image();
    img.onload=()=>{let w=img.width,h=img.height;const max=400;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>max){w=Math.round(w*max/h);h=max;}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",0.82));};
    img.src=e.target.result;};
  rd.readAsDataURL(file);
}
function pickFoto(input){const f=input.files[0];if(!f)return;
  lerFotoRedimensionada(f,d=>{_perfilFoto=d;document.getElementById("pf_avatar").innerHTML=`<img src="${d}" alt="">`;});}

}

function blocoSaida(s){
  if(s.tipo==="Morte")
    return `<div class="card" style="border-left:4px solid var(--perigo);margin-top:10px">
      <b>Saída: Morte</b><div class="meta" style="margin-top:2px">${fmt(s.data)}${s.causa?` — Causa: ${esc(s.causa)}`:""}</div></div>`;
  const arr=s.pesoLiquido!=null?(s.pesoLiquido/15):null;
  return `<div class="card" style="border-left:4px solid var(--verde);margin-top:10px">
    <b>Saída: Venda</b>
    <div class="meta" style="margin-top:2px">${fmt(s.data)}</div>
    <div class="meta" style="margin-top:4px">
      Preço da @: ${s.precoArroba!=null?moeda(s.precoArroba):"—"}<br>
      Peso bruto: ${s.pesoBruto!=null?s.pesoBruto+" kg":"—"} · Peso líquido: ${s.pesoLiquido!=null?s.pesoLiquido+" kg":"—"}${arr!=null?` (${arr.toFixed(1)} @)`:""}<br>
      ${s.condicoes?`Condições: ${esc(s.condicoes)}<br>`:""}
      ${s.valor!=null?`<b>Valor estimado: ${moeda(s.valor)}</b>`:""}

}
async function formSaida(animalId){
  let seletor="";
  if(!animalId){

    const nomeLote=id=>(lotes.find(l=>l.id===id)||{}).nome||"—";
    seletor=`<label>Animal *</label><select id="s_animal">`+
      ativos.map(a=>`<option value="${a.id}">${esc(rotulo(a))} ${codAnimal(a)} — ${esc(nomeLote(a.loteAtualId))}</option>`).join("")+`</select>`;

      <label>Peso de venda bruto (kg)</label><input id="s_bruto" inputmode="decimal" placeholder="Ex: 480">
      <label>Peso de venda líquido (kg)</label><input id="s_liq" inputmode="decimal" placeholder="Ex: 255">
      <label>Condições (tara, desconto por @, etc.)</label><textarea id="s_cond" placeholder="Texto livre"></textarea>
    </div>
    <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button>
      <button class="btn btn-perigo" onclick="salvarSaida(${animalId?`'${animalId}'`:"null"})">Registrar saída</button></div>`);}
function toggleSaida(){
  const venda=document.getElementById("s_tipo").value==="Venda";
  document.getElementById("grp_venda").style.display=venda?"block":"none";

async function salvarSaida(animalId){
  const id = animalId || (document.getElementById("s_animal")||{}).value;
  if(!id)return alert("Selecione o animal.");
  const tipo=val("s_tipo"), data=val("s_data"), hora=val("s_hora");
  let saida={tipo,data,hora}, det="";
  if(tipo==="Morte"){
    saida.causa=val("s_causa");
    det=`Causa: ${saida.causa||"não informada"}`;
  }else{
    const preco=numBR("s_preco"), bruto=numBR("s_bruto"), liq=numBR("s_liq"), cond=val("s_cond");
    const valor=(preco!=null&&liq!=null)?preco*(liq/15):null;
    saida={...saida,precoArroba:preco,pesoBruto:bruto,pesoLiquido:liq,condicoes:cond,valor};
    det=`@ ${preco!=null?moeda(preco):"—"} · bruto ${bruto??"—"}kg · líq ${liq??"—"}kg`+
        (valor!=null?` · estimado ${moeda(valor)}`:"")+(cond?` · ${cond}`:"");
  }
  await registrarEvento(id,tipo,data,det,{hora});   // já muda o status para Morto/Vendido
  const a=await get("animais",id); a.saida=saida; await put("animais",a);
  fechar(); irAba('animais');
}

async function formManejo(tipo){
  const {propriedades,lotes,animais,medicamentos}=await tudo();
  if(!lotes.length){fechar();return alert("Cadastre lote e animais primeiro.");}
  const ativos=animais.filter(a=>a.status==="Ativo").sort((x,y)=>(x.codigo||0)-(y.codigo||0));
  const nomeLote=id=>(lotes.find(l=>l.id===id)||{}).nome||"—";
  const optAnimais=ativos.map(a=>`<option value="${a.id}">${esc(rotulo(a))} ${codAnimal(a)} — ${esc(nomeLote(a.loteAtualId))}</option>`).join("");
  const optLotes=lotes.map(l=>{const p=propriedades.find(x=>x.id===l.propriedadeId);return`<option value="${l.id}">${esc(l.nome)}${p?` — ${esc(p.nome)}`:""}</option>`;}).join("");
  let especifico="";
  if(tipo==="Medicamento"){
    const optMed=medicamentos.length
      ? medicamentos.map(m=>`<option value="${m.id}">${esc(m.nome)}${m.marca?` · ${esc(m.marca)}`:""}</option>`).join("")
      : `<option value="">— nenhum cadastrado —</option>`;
    especifico=`<label>Medicamento${medicamentos.length?"":" (cadastre em + → Cadastrar medicamento)"}</label>
      <select id="mj_med">${optMed}</select>
      <label>Via de aplicação</label><select id="mj_via">${VIAS.map(v=>`<option value="${v}">${v}</option>`).join("")}</select>
      <label>Dose (opcional)</label><input id="mj_dose" placeholder="Ex: 5 ml">
      <label>Observação (opcional)</label><input id="mj_obs">`;
  }else if(tipo==="Marcação"){
    especifico=`<label>Observação (opcional)</label><input id="mj_obs" placeholder="Ex: ferro IJG, mossa…">`;
  }else if(tipo==="Movimentação"){
    especifico=`<label>Lote de destino *</label><select id="mj_destino">${optLotes}</select>`;
  }
  const titulo=tipo==="Movimentação"?"Trocar de lote":(tipo==="Marcação"?"Marcar animais":"Medicamento aplicado");
  abrir(`<h2>${titulo}</h2>
    <label>Aplicar a</label>
    <select id="mj_alvo" onchange="toggleAlvo()">
      <option value="animal">Um animal específico</option>
      <option value="lote">Lote inteiro</option></select>
    <div id="grp_animal"><label>Animal</label><select id="mj_animal">${optAnimais||`<option value="">— nenhum animal ativo —</option>`}</select></div>
    <div id="grp_lote" style="display:none"><label>Lote</label><select id="mj_lote">${optLotes}</select></div>
    <label>Data e hora</label>
    <div class="lado"><input id="mj_data" type="date" value="${hoje()}"><input id="mj_hora" type="time" value="${horaAgora()}"></div>
    ${especifico}
    <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button>
      <button class="btn" onclick="salvarManejo('${tipo}')">Registrar</button></div>`);
}
function toggleAlvo(){
  const lote=document.getElementById("mj_alvo").value==="lote";
  document.getElementById("grp_animal").style.display=lote?"none":"block";
  document.getElementById("grp_lote").style.display=lote?"block":"none";
}
async function salvarManejo(tipo){
  const alvo=document.getElementById("mj_alvo").value;
  const data=val("mj_data"), hora=val("mj_hora");
  const todos=await getAll("animais");
  let lista=[];
  if(alvo==="animal"){
    const id=(document.getElementById("mj_animal")||{}).value;
    if(!id)return alert("Selecione o animal.");
    lista=[id];
  }else{
    const loteId=(document.getElementById("mj_lote")||{}).value;
    lista=todos.filter(a=>a.loteAtualId===loteId&&a.status==="Ativo").map(a=>a.id);
    if(!lista.length)return alert("Esse lote não tem animais ativos.");
  }
  let n=0;
  if(tipo==="Movimentação"){
    const destino=val("mj_destino");
    const lotes=await getAll("lotes");
    const nomeLote=id=>(lotes.find(l=>l.id===id)||{}).nome||"—";
    const nomeDest=nomeLote(destino);
    for(const id of lista){
      const a=await get("animais",id);
      if(a.loteAtualId===destino)continue;
      const de=nomeLote(a.loteAtualId);
      a.loteAtualId=destino;await put("animais",a);
      await registrarEvento(id,"Movimentação",data,`De "${de}" para "${nomeDest}"`,{hora});n++;
    }
    if(!n){fechar();return alert("Os animais já estão nesse lote.");}
  }else if(tipo==="Marcação"){
    const obs=val("mj_obs");
    for(const id of lista){await registrarEvento(id,"Marcação",data,obs,{hora});n++;}
  }else if(tipo==="Medicamento"){
    const medId=(document.getElementById("mj_med")||{}).value||null;
    const via=val("mj_via"), dose=val("mj_dose"), obs=val("mj_obs");
    for(const id of lista){await registrarEvento(id,"Medicamento",data,obs,{hora,medicamentoId:medId,via,dose});n++;}
  }
  fechar();render();alert(`Registrado em ${n} animal(is).`);
}

/* ======================= BACKUP ======================= */
async function exportar(){
  const d={versao:2,exportadoEm:new Date().toISOString()};
  for(const s of["propriedades","marcas","lotes","animais","eventos","medicamentos","perfil"])d[s]=await getAll(s);
  const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=`rebanho-backup-${hoje()}.json`;a.click();URL.revokeObjectURL(u);
}
function importar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);
    if(!confirm("Importar substitui TODOS os dados atuais. Continuar?"))return;
    for(const s of["propriedades","marcas","lotes","animais","eventos","medicamentos","perfil"]){
      for(const it of await getAll(s))await del(s,it.id);for(const it of(d[s]||[]))await put(s,it);}
    alert("Backup importado.");render();
  }catch(e){alert("Arquivo inválido.");}};r.readAsText(f);}
